name: Ryker Room CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Compliance & Vault Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: supersecretadminpassword
          POSTGRES_DB: ryker_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "greenlet>=3.0.0" "moto[s3]>=5.0.0" pytest pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Configure Roles and Run Alembic Migrations
        env:
          ADMIN_URL: postgresql+asyncpg://postgres:supersecretadminpassword@localhost:5432/ryker_vault
          DATABASE_URL: postgresql+asyncpg://postgres:supersecretadminpassword@localhost:5432/ryker_vault
        run: |
          cd backend
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def init_roles():
              engine = create_async_engine('$ADMIN_URL')
              async with engine.begin() as conn:
                  await conn.execute(text('''
                      DO \$\$
                      BEGIN
                          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'ryker_app_user') THEN
                              CREATE ROLE ryker_app_user WITH LOGIN PASSWORD 'SecureClientAppPass123!' NOSUPERUSER NOCREATEDB NOCREATEROLE;
                          ELSE
                              ALTER ROLE ryker_app_user WITH NOSUPERUSER NOCREATEDB NOCREATEROLE;
                          END IF;
                      END
                      \$\$;
                  '''))
                  await conn.execute(text('GRANT ALL PRIVILEGES ON DATABASE ryker_vault TO ryker_app_user'))
                  await conn.execute(text('GRANT ALL ON SCHEMA public TO ryker_app_user'))
                  await conn.execute(text('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO ryker_app_user'))
                  await conn.execute(text('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ryker_app_user'))
              await engine.dispose()
          asyncio.run(init_roles())
          "
          alembic upgrade head
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def grant_permissions():
              engine = create_async_engine('$ADMIN_URL')
              async with engine.begin() as conn:
                  await conn.execute(text('GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ryker_app_user'))
                  await conn.execute(text('GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ryker_app_user'))
              await engine.dispose()
          asyncio.run(grant_permissions())
          "

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://ryker_app_user:SecureClientAppPass123!@localhost:5432/ryker_vault
          POSTGRES_USER: ryker_app_user
          POSTGRES_PASSWORD: SecureClientAppPass123!
          POSTGRES_DB: ryker_vault
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          cd backend
          pytest -v

  docker-build:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ryker-room-api:latest
            ghcr.io/${{ github.repository_owner }}/ryker-room-api:${{ github.sha }}
